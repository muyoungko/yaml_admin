login:
  jwt-secret: ${JWT_SECRET}
  expires: 600
  password-encoding: sha512 # bcrypt, sha512, sha256
  id-password:
    entity: admin
    id-field: email 
    password-field: password
  master-email: master
  master-password: '5756'
api-host: 
  uri: http://localhost:6911
web-host: 
  uri: http://localhost:6900
database:
  mongodb: 
    uri: ${MONGODB_URL}
upload:
  s3:
    access_key_id: ${S3_ACCESS_KEY_ID}
    secret_access_key: ${S3_SECRET_ACCESS_KEY}
    region: ${S3_REGION}
    prefix: ${S3_PREFIX}
    bucket: ${S3_BUCKET}
    bucket_private: ${S3_BUCKET_PRIVATE}
    base_url: ${S3_BASE_URL}
  # local:
  #   path: ./upload
  #   path_private: ./upload_private
  #   base_url: http://localhost:6911
entity:
  server:
    hidden: true
    label: "조직"
    crud:
      search:
        - name: id
        - name: region
          exact: false
        - name: factory
          exact: false
      list: true
      create: true
      edit: true
      show: true
      delete: true
    fields:
      - name: id
        label: "ID"
        type: integer
        required: true
        key: true
        autogenerate: true
      - name: region
        label: "지역"
        type: string
        required: true
      - name: factory
        label: "조직명"
        type: string
        required: true
  top_floor:
    icon: "solar:map-broken"
    label: "최상위 도면"
    hidden: true
    crud:
      search:
        - name: server_id
        - name: id
      list: true
      create: 
        - name: server_id
        - name: name
        - name: image
      edit: true
      show: true
      delete: true
    fields:
      - name: server_id
        label: "조직"
        type: reference
        reference_entity: server
        reference_match: id
        reference_name: factory
        required: true
      - name: id
        label: "ID"
        type: integer
        required: true
        key: true
        autogenerate: true
      - name: image
        label: "도면"
        type: image
        private: true
  floor:
    icon: "solar:map-outline"
    label: "도면"
    hidden: true
    crud:
      search:
        - name: server_id
        - name: region_id
        - name: id
      list: true
      create: 
        - name: server_id
          filter:
          - name: id
            value: $server_id
            type: integer
        - name: region_id
          default: $region_id
        - name: name
        - name: image
      edit: 
        - name: server_id
          filter:
          - name: id
            value: $server_id
            type: integer
        - name: region_id
          default: $region_id
        - name: name
        - name: image
      show: true
      delete: true
    fields:
      - name: server_id
        label: "조직"
        type: reference
        reference_entity: server
        reference_match: id
        reference_name: factory
        required: true
      - name: id
        label: "ID"
        type: integer
        required: true
        key: true
        autogenerate: true
      - name: region_id
        label: "지역"
        type: reference
        reference_entity: region
        reference_match: id
        reference_format: ${name}(id-${id})
        required: true
      - name: image
        label: "도면"
        type: image
        private: true
  region:
    label: '지역'
    hidden: true
    icon: "solar:download-square-outline"
    layout:
      left:
        - component: tree
          entity: region
          key: id
          parent_key: parent_id
          sort:
            - name: seq
              desc: false
          label: name
          parent_click:
            action:
              - type: body
                crud : list
                entity: region
                filter:
                  - name: parent_id
                    value: ${id}
                sort:
                  - name: seq
                    desc: false
    crud:
      search:
        - name: server_id
        - name: parent_id
        - name: name
      list: 
        - name: id
        - name: parent_id
        - name: name
        - name: seq
        - name: floor_id
        - name: floor_button
          type: button
          label: '도면입력'
          action:
            - type: navigate
              if: floor_id==null
              url: /floor/create?region_id=${id}
            - type: navigate
              if: floor_id!=null
              url: /floor/${floor_id}
      create: 
        - name: server_id
          filter:
          - name: id
            value: $server_id
            type: integer
        - name: parent_id
          default: $parent_id
          filter:
          - name: parent_id
            value: null
        - name: name
        - name: seq
      edit:
        - name: server_id
          filter:
          - name: id
            value: $server_id
            type: integer
        - name: parent_id
          default: $parent_id
          filter:
          - name: parent_id
            value: null
        - name: name
        - name: seq
      show: true
      delete: true
      export:
        fields:
          - name: server_id
          - name: parent_id
          - name: id
          - name: name
          - name: seq
      import:
        fields:
          - name: server_id
          - name: parent_id
          - name: id
          - name: name
          - name: seq
        upsert: true
    fields:
      - name: server_id
        label: "조직"
        type: reference
        reference_entity: server
        reference_match: id
        reference_name: factory
        required: true
      - name: parent_id
        label: "부모 장소"
        type: reference
        reference_entity: region
        reference_match: id
        reference_name: name
      - name: id
        label: "ID"
        type: integer
        required: true
        key: true
        autogenerate: true
      - name: name
        label: "이름"
        type: string
        required: true
      - name: seq
        label: "순서"
        type: integer
      - name: floor_id
        label: "도면"
        type: reference
        reference_entity: floor
        reference_match: id
        reference_format: 도면(${id})
        required: true
    api_generate:
      floor_id:
        match_from: id
        entity: floor
        match: region_id
        field: id
        single: true
  item:
    label: '장소'
    icon: "solar:download-twice-square-outline"
    crud:
      search:
        - name: id
        - name: name
      list: 
        - name: id
        - name: name
        - name: seq
        - name: ils.id
      create: 
        - name: server_id
          filter:
          - name: id
            value: $server_id
            type: integer
        - name: name
        - name: seq
      edit:
        - name: server_id
          filter:
          - name: id
            value: $server_id
            type: integer
        - name: name
        - name: seq
      show: true
      delete: true
      export:
        fields:
          - name: server_id
          - name: id
          - name: name
          - name: seq
      import:
        fields:
          - name: server_id
          - name: id
          - name: name
          - name: seq
        upsert: true
    fields:
      - name: server_id
        label: "조직"
        type: reference
        reference_entity: server
        reference_match: id
        reference_name: factory
        required: true
      - name: name
        label: "이름"
        type: string
        required: true
      - name: id
        label: "ID"
        type: integer
        required: true
        key: true
        autogenerate: true
      - name: seq
        label: "순서"
        type: integer
      - name: place_id
        label: "Location"
        type: reference
        reference_entity: place
        reference_match: id
        reference_name: id
      - name: ils.id
        label: "잠금"
        type: reference
        reference_entity: ils
        reference_match: id
        reference_name: key
      - name: lock_list
        label: "잠금자수"
        type: array
    api_generate:
      place_id:
        match_from: id
        entity: place
        match: item_id
        field: id
        single: true
      ils:
        match_from: place_id
        entity: ils
        match: place_id
        fields:
          - name: id
          - name: key
        single: true
      lock_list:
        match_from: ils.id
        entity: lock
        match: ils_id
        fields:
          - name: member_no
          - name: reg_date
          - name: member
            type: reference
            reference_entity: member
            reference_from: member_no
            reference_match: member_no
            single: true
            fields:
              - name: name
              - name: user_type
              - name: phone
  place:
    hidden: true
    label: 'Location'
    icon: "solar:download-minimalistic-bold-duotone"
    crud:
      search:
        - name: server_id
        - name: item_id
        - name: id
      list: 
        - name: server_id
        - name: item_id
        - name: id
      create: true
      edit: true
      show: true
      delete: true
      export:
        fields:
          - name: server_id
          - name: id
          - name: seq
      import:
        fields:
          - name: server_id
          - name: id
          - name: seq
        upsert: true
    fields:
      - name: server_id
        label: "조직"
        type: reference
        reference_entity: server
        reference_match: id
        reference_name: factory
        required: true
      - name: item_id
        label: "장소"
        type: reference
        required: true
        reference_entity: item
        reference_match: id
        reference_name: name
        reference_format: ${name}(${id})
      - name: id
        label: "ID"
        type: integer
        required: true
        key: true
        autogenerate: true
  member:
    label: '사용자'
    icon: "solar:user-hands-outline"
    crud:
      search: 
        - name: name
        - name: email
      list: true
      create: true
      edit: true
      show: true
      delete: true
    fields:
      - name: server_id
        label: "조직"
        type: reference
        reference_entity: server
        reference_match: id
        reference_name: factory
        required: true
      - name: member_no
        label: "회원번호"
        type: string
        required: true
        key: true
        autogenerate: true
      - name: email
        label: "로그인아이디"
        type: string
        required: true
      - name: name
        label: "이름"
        type: string
        required: true
      - name: pass
        label: "비밀번호"
        type: password
        required: true
      - name: user_type
        type: select
        label: "역할"
        select_values:
          - name: "관리자"
            label: "관리자"
          - name: "작업자"
            label: "담당자"
        required: true
      - name: phone
        type: string
        label: "전화번호"
        required: true
      - name: department_id
        label: "부서"
        type: reference
        reference_entity: department
        reference_match: id
        reference_name: name
        required: true
      - name: company
        label: "회사"
        type: string
  
  department:
    icon: "solar:city-outline"
    label: "부서"
    crud:
      search:
          - name: server_id
          - name: name
            exact: false
      list: true
      create: 
        - name: server_id
          filter:
          - name: id
            value: $server_id
            type: integer
        - name: name
      edit:
        - name: server_id
          filter:
          - name: id
            value: $server_id
            type: integer
        - name: name
      show: true
      delete: true
    fields:
      - name: server_id
        label: "조직"
        type: reference
        reference_entity: server
        reference_match: id
        reference_name: factory
        required: true
      - name: id
        label: "ID"
        type: integer
        required: true
        key: true
        autogenerate: true
      - name: name
        label: "이름"
        type: string
        required: true
              
  ils:
    icon: "solar:lock-keyhole-minimalistic-outline"
    label: "MULTISIG"
    crud:
      search:
        - name: id
        - name: server_id
        - name: key
        - name: serial
      list:
        - name: id
        - name: key
        - name: battery
        - name: serial
        - name: item.item_id
        - name: lock_list
          label: "잠금자수"
        - name: lock_list.member_no
          label: "잠금자"
        - action: lock_history_popup
          argument: 
            field: id
      create:
        - name: server_id
          filter:
          - name: id
            value: $server_id
            type: integer
        - name: key
        - name: serial
        - name: version
          default: "2"
        - name: battery
      edit: 
        - name: server_id
          filter:
          - name: id
            value: $server_id
            type: integer
        - name: key
        - name: serial
        - name: version
        - name: battery
      show: 
        - name: server_id
        - name: id
        - name: key
        - name: serial
        - name: version
        - name: battery
        - name: sync_date
        - name: item_id
        - name: lock_list
      delete: true
      export:
        fields:
          - name: id
          - name: server_id
          - name: key
          - name: serial
          - name: version
      import:
        fields:
          - name: id
          - name: server_id
          - name: key
          - name: serial
          - name: version
        upsert: true
    fields:
      - name: server_id
        label: "조직"
        type: reference
        reference_entity: server
        reference_match: id
        reference_name: factory
        required: true
      - name: id
        label: "ID"
        type: integer
        required: true
        key: true
        autogenerate: true
      - name: key
        label: "태그"
        type: string
        required: true
      - name: serial
        label: "시리얼"
        type: string
        required: true
      - name: version
        label: "버전"
        type: string
        required: true
      - name: battery
        label: "배터리"
        type: integer
      - name: sync_date
        label: "동기화"
        type: date
      - name: item.item_id
        label: "잠금 위치"
        type: reference
        reference_entity: item
        reference_match: id
        reference_name: name
      - name: lock_list
        label: "잠금목록"
        type: array
        fields:
          - name: member_no
            label: "잠금자"
            type: reference
            reference_entity: member
            reference_match: member_no
            reference_name: name
            reference_format: ${name}(${user_type})
          - name: department_id
            label: "부서"
            type: reference
            reference_entity: department
            reference_match: id
            reference_name: name
          - name: reg_date
            label: "잠금일시"
            type: date
            showtime: true
    api_generate:
      item:
        match_from: place_id
        entity: place
        match: id
        fields: 
          - name : item_id
        single: true
      lock_list:
        match_from: id
        entity: lock
        match: ils_id
        fields: 
          - name: member_no
          - name: reg_date
          - name: department_id
            type: reference
            reference_entity: member
            reference_from: member_no
            reference_match: member_no
            single: true
            field: department_id
  lock:
    hidden: true
    icon: "solar:lock-keyhole-minimalistic-outline"
    label: "잠금"
    crud:
      search:
        - name: ils_id
        - name: member_no
      list: true
      create: false
      edit: false
      delete: false
    fields:
      - name: server_id
        label: "조직"
        type: reference
        reference_entity: server
        reference_match: id
        reference_name: factory
        required: true
      - name: ils_id
        label: "MULTISIG"
        type: reference
        reference_entity: ils
        reference_match: ils_id
        reference_name: key
      - name: member_no
        label: "잠금자"
        type: reference
        reference_entity: member
        reference_match: member_no
        reference_name: name
      - name: reg_date
        label: "잠금일"
        type: date
        showtime: true
  lock_history:
    label: "잠금이력"
    icon: "solar:history-outline"
    crud:
      search:
        - name: ils_id
        - name: member_no
        - name: member.department_id
      list: true
    fields:
      - name: server_id
        label: "조직"
        type: reference
        reference_entity: server
        reference_match: id
        reference_name: factory
        required: true
      - name: ils_id
        label: "MULTISIG"
        type: reference
        reference_entity: ils
        reference_match: id
        reference_name: key
      - name: member_no
        label: "잠금자"
        type: reference
        reference_entity: member
        reference_match: member_no
        reference_name: name
      - name: member.department_id
        label: "부서"
        type: reference
        reference_entity: department
        reference_match: id
        reference_name: name
      - name: reg_date
        label: "잠금일"
        type: date
        showtime: true
      - name: lock
        label: "잠금/해제"
        type: boolean
    api_generate:
      member:
        match_from: member_no
        entity: member
        match: member_no
        fields: 
          - name: department_id
        single: true
  file:
    icon: "solar:file-check-outline"
    label: "파일"
    hidden: true
    crud:
      search:
        - name: id
        - name: attach
          exact: false
      list:
        - name: id
        - name: attach
        - name: create_date
      create: 
        - name: attach
      edit:
        - name: attach
      show: 
        - name: id
        - name: attach
        - name: create_date
      delete: true
    fields:
      - name: id
        label: "ID"
        type: integer
        required: true
        key: true
        autogenerate: true
      - name: attach
        label: "파일"
        type: file
        required: true
        private: true
      - name: create_date
        label: "등록일"
        type: date
        showtime: true
  admin:
    icon: 'solar:shield-user-outline'
    label: '운영자'
    unique:
      - name: email
    crud:
      search:
        - name: email
        - name: name
      list: true
      create:
        - name: server_id
          filter:
          - name: id
            value: $server_id
            type: integer
        - name: email
        - name: name
        - name: phone
        - name: password
      edit: 
        - name: server_id
          filter:
          - name: id
            value: $server_id
            type: integer
        - name: email
        - name: name
        - name: phone
        - name: password
      show: true
      delete: true
    fields:
      - name: server_id
        label: "조직"
        type: reference
        reference_entity: server
        reference_match: id
        reference_name: factory
        required: true
      - name: id
        label: "ID"
        type: integer
        required: true
        key: true
        autogenerate: true
      - name: email
        label: "아이디"
        type: string
        required: true
      - name: name
        label: "이름"
        type: string
        required: true
      - name: phone
        label: "휴대폰 (SMS 인증용)"
        type: string
        required: true
      - name: password
        label: "비밀번호"
        type: password
        required: true
front:
  appearance:
    pagination:
      rowsPerPage: 30
      rowsPerPageOptions: [30, 50, 100]
  dashboard:
    sections:
      - section: a
        size: 9
        components:
          - component: welcome
            text1: "안녕하세요 MULTISIG 공간 방문을 환영합니다."
            text2: "문의사항 및 지원 1566-4775 / mygo@emsson.co.kr"
            background: 'linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #2d2d2d 100%)'
          - component: count
            size: 3
            icon: solar:lock-keyhole-minimalistic-outline
            label: '전체 잠금 장치'
            desc: '전체 잠금 장치 수'
            unit: '대'
            entity: ils
            filter:
              - name: server_id
                value: $server_id
          - component: count
            size: 3
            icon: solar:lock-keyhole-outline
            label: '현재 잠금 상태'
            desc: '현재 잠금 수'
            unit: '대'
            entity: ils
            filter:
              - name: server_id
                value: $server_id
              - name: lock
                value: true
          - component: count
            size: 3
            icon: "solar:user-hands-outline"
            label: '사용자 수'
            desc: '등록된 시스템 사용자'
            unit: '명'
            entity: member
            filter:
              - name: server_id
                value: $server_id
          - component: count
            size: 3
            icon: "solar:shield-user-outline"
            label: '관리자 수'
            desc: '등록된 시스템 운영자'
            unit: '명'
            entity: admin
            filter:
              - name: server_id
                value: $server_id
          

          - component: chart
            api: '/api/mychart/lock_history2'
            id: lock_history2
            label: '일별 잠금 현황'
            debug: true
            icon: 'solar:chart-square-outline'
            type: line
            size: 12
            height: 300
            filter:
              - name: server_id
                value: $server_id
                type: integer
            x:
              label: '날짜'
              type: date
            y:
              type: integer
              max: 1
              value_text:
                - text: '잠금'
                  if: value==1
                - text: '해제'
                  if: value==0
          - component: list
            id: lock_by_item
            limit: 5
            entity: item
            label: '현재 잠금 현황'
            icon: 'solar:list-check-outline'
            type: bar
            size: 8
            height: 150
            filter:
              - name: server_id
                value: $server_id
                type: integer
              - name: lock_list
                value: $gt 0
            fields:
              - name: name
              - name: ils.key
              - name: lock_list.member.name
          - component: chart
            id: member_type
            label: '사용자 현황'
            icon: 'solar:users-group-rounded-outline'
            type: donut
            size: 4
            height: 150
            filter:
              - name: server_id
                value: $server_id
                type: integer
            x:
              type: field
              entity: member
              field: user_type
              values:
                - name: "관리자"
                  label: "관리자"
                  color: '#1a66cc'
                - name: "작업자"
                  label: "담당자"
                  color: '#228B22'
            y:
              entity: member
              
          - component: chart
            id: lock_history1
            label: '잠금/해제 이용횟수'
            icon: 'solar:history-outline'
            type: bar
            size: 12
            height: 300
            filter:
              - name: server_id
                value: $server_id
                type: integer
            x:
              label: '날짜'
              type: date
              entity: lock_history
              field: reg_date
              format: 'MM/DD'
              gap: day
              limit: 14
              timezone: Asia/Seoul
              desc: false
            y:
              type: integer
              series:
                - label: '잠금'
                  if: lock==true
                  color: '#ef4444'
                - label: '해제'
                  if: lock!=true
                  color: '#10b981'
      - section: b
        size: 3
        components:
          - component: table
            id: recent_lock_history
            label: '최근 잠금 이력'
            icon: 'solar:history-outline'
            size: 12
            limit: 5
            entity: lock_history
            sort:
              - name: reg_date
                desc: true
            filter:
              - name: server_id
                value: $server_id
                type: integer
            fields:
              - name: member_no
              - name: reg_date
              - name: ils_id
              - name: lock
          - component: table
            id: low_battery_ils
            label: '배터리 부족 MULTISIG'
            icon: 'solar:chart-square-outline'
            none: '모든 MULTISIG 배터리 정상'
            size: 12
            filter:
              - name: server_id
                value: $server_id
              - name: battery
                value: $lte 20
            limit: 100
            entity: ils
            fields:
              - name: id
              - name: key
              - name: battery
              - name: serial
              - name: version
              - name: item_id
              - name: lock_list
